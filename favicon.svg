<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="desk-favicon-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="desk-favicon-arc" x1="12" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="desk-favicon-spine" x1="12" y1="11" x2="18" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container for crisp favicon display -->
  <rect width="48" height="48" rx="12" fill="url(#desk-favicon-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Left Anchor Spine -->
  <rect x="12" y="11" width="5.5" height="26" rx="2.75" fill="url(#desk-favicon-spine)"/>

  <!-- Dimensional D Arc -->
  <path d="M16 11H26C33.732 11 40 16.82 40 24C40 31.18 33.732 37 26 37H16" stroke="url(#desk-favicon-arc)" stroke-width="5" stroke-linecap="round"/>

  <!-- Forward Workspace Shelf / Ticket Flow Tier -->
  <path d="M16 24H28C30.2091 24 32 22.2091 32 20C32 17.7909 30.2091 16 28 16H20" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
</svg>